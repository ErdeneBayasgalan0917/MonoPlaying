<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Now Playing Widget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Configuration Panel -->
    <div id="config-panel" class="config-panel">
        <button id="config-toggle" class="config-toggle">⚙️ Settings</button>
        <div id="config-content" class="config-content hidden">
            <h3>Widget Configuration</h3>
            
            <!-- Spotify API Credentials -->
            <div class="config-section">
                <label>Spotify Client ID:</label>
                <input type="text" id="clientId" placeholder="Your Client ID">
                
                <label>Spotify Access Token:</label>
                <input type="text" id="accessToken" placeholder="Your Access Token (or use Auth below)">
                
                <button id="auth-button" class="auth-btn">🔐 Authorize with Spotify</button>
            </div>

            <!-- Display Options -->
            <div class="config-section">
                <h4>Display Elements</h4>
                <label><input type="checkbox" id="show-album-art" checked> Album Art</label>
                <label><input type="checkbox" id="show-progress" checked> Progress Bar</label>
                <label><input type="checkbox" id="show-time" checked> Time (Elapsed / Duration)</label>
                <label><input type="checkbox" id="show-title" checked> Song Title</label>
                <label><input type="checkbox" id="show-artist" checked> Artist Name</label>
                <label><input type="checkbox" id="show-emote-slot" checked> Emote Slot</label>
            </div>

            <!-- Customization -->
            <div class="config-section">
                <h4>Appearance</h4>
                
                <label>Primary Color:
                    <input type="color" id="primary-color" value="#1DB954">
                </label>
                
                <label>Background Color:
                    <input type="color" id="bg-color" value="#000000">
                </label>
                
                <label>Background Opacity:
                    <input type="range" id="bg-opacity" min="0" max="1" step="0.1" value="0.7">
                    <span id="opacity-value">70%</span>
                </label>
                
                <label>Title Font Size:
                    <input type="range" id="title-size" min="12" max="48" value="24">
                    <span id="title-size-value">24px</span>
                </label>
                
                <label>Artist Font Size:
                    <input type="range" id="artist-size" min="10" max="32" value="14">
                    <span id="artist-size-value">14px</span>
                </label>
                
                <label>Widget Width:
                    <input type="range" id="widget-width" min="200" max="600" value="350">
                    <span id="width-value">350px</span>
                </label>
                
                <label>Background Style:
                    <select id="bg-style">
                        <option value="solid">Solid Color</option>
                        <option value="blur">Blur Background</option>
                        <option value="transparent">Transparent</option>
                        <option value="gradient">Gradient</option>
                    </select>
                </label>

                <label>Animation Speed:
                    <select id="animation-speed">
                        <option value="none">None</option>
                        <option value="slow">Slow</option>
                        <option value="normal" selected>Normal</option>
                        <option value="fast">Fast</option>
                    </select>
                </label>

                <label>Border Radius:
                    <input type="range" id="border-radius" min="0" max="30" value="10">
                    <span id="radius-value">10px</span>
                </label>
            </div>

            <!-- Emote Configuration -->
            <div class="config-section">
                <h4>Emote Slot</h4>
                <label>Emote Image URL:
                    <input type="text" id="emote-url" placeholder="https://example.com/emote.gif">
                </label>
                <label>Emote Size:
                    <input type="range" id="emote-size" min="20" max="150" value="60">
                    <span id="emote-size-value">60px</span>
                </label>
            </div>

            <!-- Save/Export -->
            <div class="config-section">
                <button id="save-config" class="save-btn">💾 Save Configuration</button>
                <button id="export-config" class="export-btn">📥 Export Settings</button>
                <button id="import-config" class="import-btn">📤 Import Settings</button>
            </div>
        </div>
    </div>

    <!-- Main Widget -->
    <div id="now-playing-container" class="now-playing-container">
        <div id="now-playing" class="now-playing hidden">
            <!-- Emote Slot -->
            <div id="emote-slot" class="emote-slot hidden">
                <img id="emote-img" src="" alt="Emote">
            </div>

            <!-- Album Art -->
            <div id="album-art-container" class="album-art-container">
                <img id="album-art" src="" alt="Album Art" class="album-art">
            </div>

            <!-- Track Info -->
            <div class="track-info">
                <div id="track-name" class="track-name">Not Playing</div>
                <div id="track-artist" class="track-artist">Spotify</div>
                
                <!-- Progress Bar -->
                <div id="progress-container" class="progress-container hidden">
                    <div class="progress-bar-wrapper">
                        <div id="progress-bar" class="progress-bar"></div>
                    </div>
                    <div class="time-display">
                        <span id="current-time">0:00</span>
                        <span id="total-time">0:00</span>
                    </div>
                </div>
            </div>

            <!-- Spotify Link -->
            <a id="spotify-link" href="#" target="_blank" class="spotify-link" title="Open in Spotify">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.179-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-12.018-1.5-.479.12-1.02-.239-1.139-.718-.12-.479.239-1.02.719-1.14 4.438-1.26 9.722-.555 13.394 1.71.361.239.599.923.357 1.326zm.12-3.36C15.24 9.6 8.82 9.076 5.3 10.235c-.6.187-1.237-.063-1.42-.662-.184-.599.063-1.237.661-1.42 4.261-1.346 11.217-.822 15.114 1.823.539.331.876 1.026.55 1.563-.327.527-1.063.863-1.601.527z"/>
                </svg>
            </a>
        </div>
    </div>

    <!-- Status Message -->
    <div id="status-message" class="status-message"></div>

    <script src="script.js"></script>
</body>
</html>
